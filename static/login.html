<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 컴플라이언스 시뮬레이터 - 로그인</title>
<link rel="stylesheet" href="/app/css/style.css" />
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <h1>
      <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V10l4 3V10l4 3V10l4 3v8"/><path d="M17 21V7l3 2v12"/><path d="M9 21v-4h2v4"/></svg>
      AI 컴플라이언스 시뮬레이터
    </h1>
    <div class="subtitle">발전소별 관리자 로그인</div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        로그인
      </button>
      <button class="tab-btn" data-tab="signup">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        회원가입
      </button>
    </div>

    <div id="alert-box"></div>

    <!-- 로그인 -->
    <div class="tab-panel active" id="panel-login">
      <form id="login-form">
        <div class="field">
          <label for="login-username">아이디</label>
          <input id="login-username" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">비밀번호</label>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
      </form>
    </div>

    <!-- 회원가입 -->
    <div class="tab-panel" id="panel-signup">
      <form id="signup-form">
        <div class="field">
          <label for="signup-username">아이디</label>
          <input id="signup-username" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="signup-password">비밀번호 (4자 이상)</label>
          <input id="signup-password" type="password" autocomplete="new-password" required minlength="4" />
        </div>
        <div class="field">
          <label for="signup-plant">소속 발전소</label>
          <select id="signup-plant" required></select>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="signup-submit">회원가입</button>
      </form>
    </div>
  </div>
</div>
<script src="/app/js/login.js"></script>
</body>
</html>
