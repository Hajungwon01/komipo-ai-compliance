<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 컴플라이언스 시뮬레이터 - 챗봇</title>
<link rel="stylesheet" href="/app/css/style.css" />
</head>
<body>
<div class="topbar">
  <div class="brand">
    <svg class="icon emoji" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V10l4 3V10l4 3V10l4 3v8"/><path d="M17 21V7l3 2v12"/><path d="M9 21v-4h2v4"/></svg>
    AI 컴플라이언스 시뮬레이터
  </div>
  <div class="user-box">
    <span class="plant-chip" id="plant-chip">불러오는 중...</span>
    <button class="btn btn-ghost" id="guide-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      가이드
    </button>
    <button class="btn btn-ghost" id="logout-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      로그아웃
    </button>
  </div>
</div>

<div class="chat-shell">
  <div class="sidebar">
    <h4>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      서류 업로드
    </h4>
    <label class="upload-box" id="upload-box">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
      <span>클릭해서 인허가 서류 선택</span>
      <div class="hint">PDF 또는 TXT</div>
      <input type="file" id="file-input" accept=".pdf,.txt" style="display:none" />
    </label>
    <div class="upload-filename" id="upload-filename"></div>
    <p class="hint" id="plant-scope-note" style="margin-top:14px; color: var(--muted); font-size: 12.5px; line-height:1.6;"></p>

    <h4>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      데모 안내
    </h4>
    <div class="demo-note">
      · 등록된 배출기준 수치는 검증 수준이 항목마다 다른 데모용 데이터입니다.<br />
      · 정규식 기반 추출이라 서류 서식에 따라 인식이 안 될 수 있습니다.<br />
      · 법적 효력이 있는 검토 결과가 아닙니다.
    </div>
  </div>

  <div class="chat-main">
    <div class="chat-scroll" id="chat-scroll"></div>
    <div class="typing-note hidden" id="typing-note"><span class="spinner"></span> 답변을 생성하는 중...</div>
    <div class="chat-input-bar">
      <input type="text" id="chat-input" placeholder="검토 결과에 대해 궁금한 점을 물어보세요..." />
      <button class="btn btn-primary" id="send-btn">전송</button>
    </div>
  </div>
</div>

<script src="/app/js/chat.js"></script>
</body>
</html>
